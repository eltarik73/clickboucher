version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope
    groups:
      # Group all minor/patch dev deps to reduce PR noise
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Group safe minor/patch prod updates
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Pin Next.js majors — manually upgrade to avoid surprises
      - dependency-name: next
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      # Pin Clerk majors — auth migrations need manual review
      - dependency-name: "@clerk/*"
        update-types:
          - version-update:semver-major
      # Pin Prisma majors — schema/migration breaking changes
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/*"
        update-types:
          - version-update:semver-major
      # Stripe : chaque mineure change le littéral `apiVersion` typé dans
      # src/lib/stripe.ts (échec tsc) — montée de version manuelle uniquement
      - dependency-name: stripe
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # sharp est en 0.x : une mineure peut être cassante
      - dependency-name: sharp
        update-types:
          - version-update:semver-minor
      # Alignés sur Next 14 / Node 20 — majeures à monter avec le framework
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
