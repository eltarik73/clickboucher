name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # DATABASE_URL du service Postgres des jobs test/build (lint/typecheck ne s'y connectent pas)
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  DIRECT_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  # Valid-format Clerk fake keys (Clerk validates prefix + base64 shape at build)
  CLERK_SECRET_KEY: "sk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
  NEXT_PUBLIC_SITE_URL: "https://klikandgo.app"
  NEXT_PUBLIC_APP_URL: "https://klikandgo.app"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

  test:
    name: Tests (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply Prisma schema to CI database
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Vitest run
        run: npm run test:run

      # Code applicatif contre le PostgreSQL du job, dans le schéma `itest` (créé par le setup
      # global de Vitest) : le schéma `public` poussé plus haut n'est pas modifié.
      - name: Integration tests (PostgreSQL réel)
        run: npm run test:integration

  build:
    name: Build (next build + prerender check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # `next build` prérend les pages publiques (statique/ISR) en interrogeant
    # Prisma : il lui faut une vraie base. Le DATABASE_URL / DIRECT_DATABASE_URL
    # du workflow (ci:ci@localhost:5432/ci) pointe sur ce service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply Prisma schema to CI database
        run: npx prisma db push --skip-generate --accept-data-loss

      # prisma generate + next build. scripts/prisma-migrate-prod-only.mjs sort
      # sans migrer hors production Vercel (VERCEL_ENV absent ici).
      - name: Next.js build
        run: npm run build

      # Échoue si /, /cgv, /a-propos, /recettes, /boucherie-halal/chambery,
      # /boucherie-halal/lyon, /boucherie-halal/aix-les-bains, /boucheries-halal/savoie,
      # /occasions/aid-al-adha/chambery ou /sitemap.xml ne sont plus prérendus, ou si moins
      # de 250 routes le sont.
      - name: Check prerendered routes
        run: node scripts/check-prerender.mjs

      # Parcours photos (tests/e2e/photos.spec.ts) sur le build de production ci-dessus, réutilisé
      # tel quel. Base : le PostgreSQL de ce job, rempli par le seed APRÈS le build (les pages
      # prérendues ne changent pas ; le parcours ne visite que des pages dynamiques ou clientes).
      # Stockage des photos : aucun BLOB_READ_WRITE_TOKEN ici, le serveur choisit donc le stockage
      # local sur disque (.image-store/). Mode test ouvert par POST /api/test-mode/activate avec un
      # secret tiré à chaque lancement : aucune valeur secrète n'est écrite dans ce fichier.
      # Le même serveur sert ensuite les contrôles SEO (tests/e2e/seo-status.spec.ts : vrais 404,
      # robots, JSON-LD, sitemap), en lecture seule.
      - name: Seed CI database (photos e2e)
        run: npx prisma db seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Photos e2e (Playwright, production build)
        env:
          TEST_MODE: "true"
          ALLOW_TEST_IN_PROD: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
        run: |
          export TEST_SECRET="$(openssl rand -hex 24)"
          export E2E_TEST_SECRET="$TEST_SECRET"
          npx next start -p 3000 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health > /dev/null
          npx playwright test tests/e2e/photos.spec.ts tests/e2e/seo-status.spec.ts --project=chromium

      - name: Next server log
        if: failure()
        run: cat next-start.log
