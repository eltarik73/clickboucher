name: Claude Security Review

# Security scanning via Claude (nouveauté Anthropic mai 2026).
# Utilise l'action officielle anthropics/claude-code-security-review.
#
# Différence avec un linter classique :
#   - Ne fait PAS de pattern matching → trace les data flows
#   - Lit le code source + examine interactions cross-file/modules
#   - Donne confidence + severity + impact + repro steps + fix recommandé
#
# Trigger : sur chaque PR vers main (catch les vulns avant prod).
# L'action ne scanne QUE les événements pull_request : pour tout autre événement
# elle sort avec "ClaudeCode only runs on pull requests, skipping". L'ancien cron
# hebdo n'a donc jamais audité main, et c'est lui qui a fait désactiver le
# workflow par GitHub (disabled_inactivity) — supprimé (audit 2026-11).
# Réactivation : `gh workflow enable "Claude Security Review"`.
#
# Setup : requiert secret ANTHROPIC_API_KEY dans Settings → Secrets → Actions.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch: # Run manuel = vérif de démarrage uniquement (aucun scan hors PR)

concurrency:
  group: claude-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  security-review:
    name: Claude Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip les PRs Dependabot : GitHub ne transmet PAS les Actions secrets aux
    # workflows déclenchés par dependabot[bot] (store séparé), donc
    # ANTHROPIC_API_KEY est vide → échec systématique. Ces bumps ne sont donc
    # PAS scannés par Claude (aucun autre déclencheur ne les couvre) : seule la
    # CI les valide. (audit 2026-06-12, aligné sur claude-code-review.yml)
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude Security Review
        # Épinglé sur un SHA de commit (main au 2026-02-11) : l'action reçoit
        # ANTHROPIC_API_KEY et un token pull-requests:write, une ref mutable
        # (@main) pourrait être réécrite à notre insu.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modèle explicite : le défaut de l'action à ce SHA est
          # claude-opus-4-1-20250805, retiré le 2026-08-05 (échec sur chaque PR).
          claude-model: claude-sonnet-5-5
          comment-pr: true
          # Focus Klik&Go (Next.js + Prisma + Clerk). L'input attend un CHEMIN de
          # fichier et l'action fait `cd "$ACTION_PATH"` avant de le lire : chemin
          # ABSOLU obligatoire (du texte inline ou un chemin relatif est ignoré
          # sans erreur — c'était le cas jusqu'ici).
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security/scan-instructions.txt
